# Local Postgres for development and tests: `docker compose up -d`
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: skillsync
      POSTGRES_PASSWORD: skillsync
      POSTGRES_DB: skillsync
    ports:
      - "5433:5432" # 5433 on your computer, so it cannot clash with a Postgres you installed yourself
    volumes:
      - skillsync-pg:/var/lib/postgresql/data
volumes:
  skillsync-pg:
