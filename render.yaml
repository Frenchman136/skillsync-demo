# Render Blueprint: New > Blueprint > pick this repository. Creates the free API and the free Postgres.
# Free Postgres is deleted 30 days after creation. Recreate it if you use this later.
databases:
  - name: skillsync-db
    plan: free
    databaseName: skillsync
    user: skillsync

services:
  - type: web
    name: skillsync-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: skillsync-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@skillsync.local
      - key: ADMIN_PASSWORD   # you type this in the Render dashboard. It is never stored in the code.
        sync: false
      - key: CORS_ORIGIN      # your Vercel address, e.g. https://skillsync.vercel.app (no trailing slash)
        sync: false
